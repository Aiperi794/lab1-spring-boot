<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .hero {
            max-width: 560px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #6366f1;
            background: #eef2ff;
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        p.subtitle {
            font-size: 17px;
            font-weight: 400;
            line-height: 1.6;
            color: #6b7280;
            margin-bottom: 40px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #111;
            color: #fff;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #fff;
            color: #111;
            border: 1px solid #e5e7eb;
        }

        .btn-secondary:hover {
            border-color: #111;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
<div class="hero">
    <span class="badge">Task Manager</span>
    <h1 th:text="${message}">Welcome to the Task Management System!</h1>
    <p class="subtitle">
        Управляйте задачами эффективно. Создавайте, редактируйте и отслеживайте прогресс в одном месте.
    </p>
    <div class="actions">
        <a th:href="@{/tasks}" class="btn btn-primary">Перейти к задачам →</a>
    </div>
</div>
</body>
</html>
