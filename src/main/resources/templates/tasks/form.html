<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая задача</title>
    <style>
        form { width: 400px; margin: 20px auto; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="date"] { width: 100%; padding: 6px; }
        button { margin-top: 15px; padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<h1 style="text-align:center;">Новая задача</h1>
<form th:action="@{/tasks}" th:object="${task}" method="post">
    <label>Название:</label>
    <input type="text" th:field="*{name}" required/>

    <label>Описание:</label>
    <input type="text" th:field="*{description}"/>

    <label>Дата:</label>
    <input type="date" th:field="*{dueDate}"/>

    <label>Выполнено:</label>
    <input type="checkbox" th:field="*{completed}"/>

    <button type="submit">Сохранить</button>
</form>
</body>
</html>
