<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            padding: 40px;
        }

        .card h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .card .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="date"],
        textarea {
            width: 100%;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 14.5px;
            color: #111;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            transition: all 0.15s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input::placeholder,
        textarea::placeholder {
            color: #9ca3af;
        }

        textarea {
            resize: vertical;
            min-height: 88px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .checkbox-row:hover {
            border-color: #d1d5db;
            background: #fafafa;
        }

        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .checkbox-row span {
            font-size: 14.5px;
            color: #374151;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #111;
            color: #fff;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: #fff;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        .btn-ghost:hover {
            color: #111;
            border-color: #111;
        }
    </style>
</head>
<body>
<div class="card">
    <h1 th:text="${task.id != null} ? 'Редактировать задачу' : 'Новая задача'">
        Новая задача
    </h1>
    <p class="subtitle">
        Заполните поля и сохраните изменения
    </p>

    <form th:action="@{/task/save}" th:object="${task}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="field">
            <label for="name">Название</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Например, сделать отчёт" />
        </div>

        <div class="field">
            <label for="description">Описание</label>
            <textarea id="description" th:field="*{description}" placeholder="Кратко опишите задачу"></textarea>
        </div>

        <div class="field">
            <label for="dueDate">Срок выполнения</label>
            <input type="date" id="dueDate" th:field="*{dueDate}" />
        </div>

        <div class="field">
            <label class="checkbox-row">
                <input type="checkbox" th:field="*{completed}" />
                <span>Задача выполнена</span>
            </label>
        </div>

        <div class="actions">
            <a th:href="@{/tasks}" class="btn btn-ghost">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
    </form>
</div>
</body>
</html>
