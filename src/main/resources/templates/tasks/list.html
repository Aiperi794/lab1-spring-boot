<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
            min-height: 100vh;
            padding: 48px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header .count {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #111;
            color: #fff;
        }

        .btn-primary:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }

        .btn-ghost:hover {
            color: #111;
            border-color: #111;
        }

        .card {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 16px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #9ca3af;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #fcfcfc;
        }

        tbody td {
            padding: 18px 20px;
            font-size: 14.5px;
            color: #1f2937;
            border-bottom: 1px solid #f5f5f5;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.12s ease;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .id-cell {
            color: #9ca3af;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            width: 60px;
        }

        .name-cell {
            font-weight: 500;
            color: #111;
        }

        .desc-cell {
            color: #6b7280;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .date-cell {
            color: #6b7280;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-completed {
            background: #ecfdf5;
            color: #059669;
        }
        .status-completed::before { background: #10b981; }

        .status-pending {
            background: #fff7ed;
            color: #c2410c;
        }
        .status-pending::before { background: #f97316; }

        .link-edit {
            color: #6366f1;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.12s ease;
            white-space: nowrap;
        }

        .link-edit:hover {
            background: #eef2ff;
        }

        .empty {
            padding: 64px 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 15px;
        }

        .empty span {
            display: block;
            font-size: 40px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Задачи</h1>
            <div class="count" th:text="${#lists.size(tasks)} + ' всего'">0 всего</div>
        </div>
        <div class="actions">
            <a th:href="@{/}" class="btn btn-ghost">← На главную</a>
            <a th:href="@{/task/new}" class="btn btn-primary">+ Новая задача</a>
        </div>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Дата</th>
                <th>Статус</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td class="id-cell" th:text="'#' + ${task.id}">#1</td>
                <td class="name-cell" th:text="${task.name}">Task name</td>
                <td class="desc-cell" th:text="${task.description}">Description</td>
                <td class="date-cell" th:text="${task.dueDate}">2026-10-01</td>
                <td>
                    <span th:if="${task.completed}" class="status status-completed">Выполнено</span>
                    <span th:unless="${task.completed}" class="status status-pending">В процессе</span>
                </td>
                <td style="text-align: right;">
                    <a th:href="@{/task/edit/{id}(id=${task.id})}" class="link-edit">Редактировать</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="6" class="empty">
                    <span>📋</span>
                    Задач пока нет. Создайте первую!
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
