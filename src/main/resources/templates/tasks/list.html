<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задачи</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fafafa;
            color: #111;
            min-height: 100vh;
            padding: 48px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header .count {
            font-size: 14px;
            color: #6b7280;
            margin-top: 4px;
        }

        .actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 10px;
            border: none;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .btn-primary { background: #111; color: #fff; }
        .btn-primary:hover { background: #000; transform: translateY(-1px); }

        .btn-ghost {
            background: transparent;
            color: #6b7280;
            border: 1px solid #e5e7eb;
        }
        .btn-ghost:hover { color: #111; border-color: #111; }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        /* Форма фильтрации */
        .filter-card {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .filter-title {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 14px;
        }

        .filter-form {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-field label {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }

        .filter-field select,
        .filter-field input {
            font-family: inherit;
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fff;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .filter-field select:focus,
        .filter-field input:focus {
            border-color: #6366f1;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
        }

        /* Информация о фильтре */
        .filter-info {
            background: #eef2ff;
            color: #4f46e5;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #ececec;
            border-radius: 16px;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }

        thead th {
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #9ca3af;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #fcfcfc;
        }

        tbody td {
            padding: 18px 20px;
            font-size: 14.5px;
            color: #1f2937;
            border-bottom: 1px solid #f5f5f5;
            vertical-align: middle;
        }

        tbody tr:last-child td { border-bottom: none; }
        tbody tr { transition: background 0.12s ease; }
        tbody tr:hover { background: #fafafa; }

        .id-cell {
            color: #9ca3af;
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            width: 60px;
        }

        .name-cell { font-weight: 500; color: #111; }

        .desc-cell {
            color: #6b7280;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .date-cell {
            color: #6b7280;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .status::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-completed { background: #ecfdf5; color: #059669; }
        .status-completed::before { background: #10b981; }

        .status-pending { background: #fff7ed; color: #c2410c; }
        .status-pending::before { background: #f97316; }

        .actions-cell {
            text-align: right;
            white-space: nowrap;
        }

        .link-edit, .link-delete {
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.12s ease;
        }

        .link-edit { color: #6366f1; }
        .link-edit:hover { background: #eef2ff; }

        .link-delete { color: #dc2626; }
        .link-delete:hover { background: #fef2f2; }

        .empty {
            padding: 64px 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 15px;
        }

        .empty span { display: block; font-size: 40px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div>
            <h1>Задачи</h1>
            <div class="count" th:text="${#lists.size(tasks)} + ' всего'">0 всего</div>
        </div>
        <div class="actions">
            <a th:href="@{/}" class="btn btn-ghost">← На главную</a>
            <a th:href="@{/task/new}" class="btn btn-primary">+ Новая задача</a>
        </div>
    </div>

    <!-- ФОРМА ФИЛЬТРАЦИИ -->
    <div class="filter-card">
        <div class="filter-title">Фильтрация</div>
        <form action="/tasks/filter-full" method="get" class="filter-form">

            <div class="filter-field">
                <label for="completed">Статус</label>
                <select name="completed" id="completed">
                    <option value="">Все</option>
                    <option value="true">Выполненные</option>
                    <option value="false">Невыполненные</option>
                </select>
            </div>

            <div class="filter-field">
                <label for="startDate">Дата с</label>
                <input type="date" name="startDate" id="startDate" />
            </div>

            <div class="filter-field">
                <label for="endDate">Дата по</label>
                <input type="date" name="endDate" id="endDate" />
            </div>

            <div class="filter-actions">
                <button type="submit" class="btn btn-primary btn-small">Применить</button>
                <a th:href="@{/tasks}" class="btn btn-ghost btn-small">Сбросить</a>
            </div>
        </form>
    </div>

    <!-- Информация о текущем фильтре -->
    <div th:if="${filterInfo}" class="filter-info" th:text="${filterInfo}">
        Показаны отфильтрованные задачи
    </div>

    <!-- ТАБЛИЦА ЗАДАЧ -->
    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Дата</th>
                <th>Статус</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td class="id-cell" th:text="'#' + ${task.id}">#1</td>
                <td class="name-cell" th:text="${task.name}">Task name</td>
                <td class="desc-cell" th:text="${task.description}">Description</td>
                <td class="date-cell" th:text="${task.dueDate}">2026-10-01</td>
                <td>
                    <span th:if="${task.completed}" class="status status-completed">Выполнено</span>
                    <span th:unless="${task.completed}" class="status status-pending">В процессе</span>
                </td>
                <td class="actions-cell">
                    <a th:href="@{/task/edit/{id}(id=${task.id})}" class="link-edit">Изменить</a>
                    <a th:href="@{/task/delete/{id}(id=${task.id})}"
                       class="link-delete"
                       onclick="return confirm('Удалить задачу?')">Удалить</a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="6" class="empty">
                    <span>🔍</span>
                    По вашему запросу ничего не найдено.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
